  <line x1="157" y1="82" x2="98" y2="88" stroke="#a0b8cc" stroke-width="0.4" opacity="0.5"/>
  <line x1="155" y1="84" x2="92" y2="96" stroke="#a0b8cc" stroke-width="0.4" opacity="0.5"/>
  <!-- Wing veins right lower -->
